name: ccd
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  # Broad, compatible constraint for recent Flutter/Dart toolchains.
  # If you get an SDK version error, either update your Flutter or adjust this range.
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # Firebase (put these under dependencies)
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.2
  intl: ^0.20.2
  pdf: ^3.10.4
  path_provider: ^2.1.5
  firebase_messaging: ^16.0.2
  http: ^1.5.0
  get: ^4.7.2
  shared_preferences: ^2.5.3
  lottie: ^3.3.2
  percent_indicator: ^4.2.5
  dotenv: ^4.2.0
  mailer: ^6.5.0
  flutter_dotenv: ^6.0.0
  pinput: ^5.0.2
  open_filex: ^4.7.0
  tflite_flutter: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/models/decision_tree_model.tflite
    - assets/models/logistic_model.tflite
    - assets/models/knn_model.tflite
    - assets/models/random_forest_model.tflite
    - assets/emailverify.json



